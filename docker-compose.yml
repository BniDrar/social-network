
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - sqlite-data:/app/data
    environment:
      - SQLITE_PATH=/app/data/db
      - MIGRATION_PATH=migrations/sqlite
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8080
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlite-data:
